[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbibm"
description = "Hierarchical Simulation-based inference benchmark"
readme = "README.md"
dynamic = ["version"]
authors = [
    { name = "Giovanni Charles", email = "gc1610@ic.ac.uk" },
]
requires-python = ">=3.7"
license = { text = "MIT" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "diffrax>=0.7.0",
    "numpy>=1.26.4",
    "matplotlib",
    "pandas>=1.0.0",
    "sbi>=0.25.0",
    "pyro-ppl",
    "scikit-learn",
    "torch>=1.8.0",
    "tqdm",
    "pytorch-lightning>=2.6.0",
    "einops>=0.8.1",
    "hydra-core",
    "tfmpe @ git+https://github.com/mrc-ide/tfmpe.git@0.0.1",
    "probjax @ git+https://github.com/giovannic/simformer/#subdirectory=src/probjax",
    "scoresbibm @ git+https://github.com/giovannic/simformer/#subdirectory=src/scoresbibm",
]

[project.optional-dependencies]
dev = [
    "autoflake",
    "black",
    "flake8",
    "isort>5.0.0",
    "ipdb",
    "pytest",
    "pytest-benchmark",
    "pytest-plt",
    "typeguard",
]

[project.urls]
documentation = "https://sbi-benchmark.github.io/"
source = "https://github.com/sbi-benchmark/sbibm"
tracker = "https://github.com/sbi-benchmark/sbibm/issues"

[tool.setuptools.packages.find]
include = ["sbibm*"]
exclude = ["tests", "tests.*"]

[tool.setuptools.dynamic]
version = {attr = "sbibm.__version__.__version__"}

[tool.flake8]
exclude = ["docs", "build", "dist", ".ipynb_checkpoints", ".git", "third_party"]
max-line-length = 119
extend-ignore = ["W503", "E203"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "--ignore=src/ --import-mode=importlib -m 'not skip_by_default and not slow'"
testpaths = ["tests"]
plt_filename_drop = ["^--"]
markers = [
    "skip_by_default: skip benchmark tests by default (use -m benchmark to run)",
    "slow: mark test as slow (skipped by default; use -m slow to run)",
]
